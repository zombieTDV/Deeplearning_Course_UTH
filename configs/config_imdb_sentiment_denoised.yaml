# Exercise 2 — Denoised Dataset + LoRA Adaptation Preset (EXP-LORA-DENOISED)
model:
  name: "distilbert-base-uncased"
  num_labels: 2
  id2label:
    "0": "neg"
    "1": "pos"
  label2id:
    "neg": 0
    "pos": 1

data:
  name: "stanfordnlp/imdb"
  max_length: 512
  val_size: 0.1
  seed: 42
  processed_dir: "data/processed/imdb_denoised_512"

lora:
  r: 32
  lora_alpha: 64
  target_modules: ["q_lin", "k_lin", "v_lin", "out_lin"]
  lora_dropout: 0.10
  bias: "none"
  task_type: "SEQ_CLS"

training:
  seed: 42
  run_name: "distilbert-finetune-lora-denoised-peak"
  run_root: "experiments/runs"
  batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 4
  lr: 3.0e-4
  weight_decay: 0.01
  classifier_dropout: 0.20
  label_smoothing_factor: 0.05
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.10
  save_total_limit: 3
  early_stopping_patience: 5
  fp16: true
  logging_steps: 50
  eval_steps: 100
  eval_strategy: "steps"
  save_strategy: "steps"
  metric_for_best_model: "eval_accuracy"
  greater_is_better: true
