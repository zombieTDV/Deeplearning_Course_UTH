name: CI

on:
  push:
    branches: [main, LAB2, LAB1-FashionMNIST-Classification]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Run tests
        run: pytest
        # Data-dependent tests are skipped when data/raw is absent (see tests/conftest.py),
        # so CI runs the synthetic unit suite without the dataset.
