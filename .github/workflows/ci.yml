name: CI

on:
  push:
    branches: [main, consolidate/unified-main]
  pull_request:
    branches: [main, consolidate/unified-main]

jobs:
  test:
    name: Multi-Lab Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (CPU)
        run: |
          pip install -r requirements.txt

      - name: Install package editable
        run: |
          pip install -e .

      - name: Lint maintained packages (Ruff)
        run: |
          ruff check --select E,F,W --ignore E501,E402 --exclude "src/lab2/experiments,src/lab3/experiments" src/lab2 src/lab3

      - name: Run LAB1 tests
        run: |
          pytest tests/lab1 -v

      - name: Run LAB2 tests
        run: |
          pytest tests/lab2 -v -m "not gpu"

      - name: Run LAB3 tests
        run: |
          pytest tests/lab3 -v -m "not gpu"
