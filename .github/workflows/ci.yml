name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CUDA wheels (+cu130) are not hosted on PyPI — install via the PyTorch index
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cu130
          pip install ruff
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Run tests
        run: pytest
        # The smoke suite verifies package imports and directory layout only;
        # no data or GPU is required on CI.
